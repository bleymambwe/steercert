[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "steercert"
dynamic = ["version"]
description = "Sensor/actuator audits for language-model probes and steering vectors: does the direction a monitor reads also control the behaviour?"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Blessings Mambwe", email = "bleymambwe@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = [
  "interpretability",
  "activation steering",
  "linear probes",
  "AI safety",
  "language models",
  "representation engineering",
  "diffusion language models",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.40"]
steering-vectors = ["steercert[hf]", "steering-vectors>=0.12"]
repeng = ["steercert[hf]", "repeng>=0.3"]
nnsight = ["steercert[hf]", "nnsight>=0.7"]
lm-eval = ["steercert[hf]", "lm-eval>=0.4.8"]
all = ["steercert[hf,steering-vectors,repeng,nnsight]"]
test = ["pytest>=8", "pytest-cov>=5"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = ["steercert[hf,test,docs]", "ruff>=0.6", "mypy>=1.10", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/bleymambwe/steercert"
Documentation = "https://bleymambwe.github.io/steercert"
Repository = "https://github.com/bleymambwe/steercert"
Issues = "https://github.com/bleymambwe/steercert/issues"
Changelog = "https://github.com/bleymambwe/steercert/blob/main/CHANGELOG.md"

[project.scripts]
steercert = "steercert.cli:main"

[tool.hatch.version]
path = "src/steercert/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.hatch.build.targets.wheel]
packages = ["src/steercert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "hf: needs torch and transformers (tiny random models, no download)",
  "integration: needs an optional third-party library",
  "network: downloads a model from the Hugging Face Hub",
]
filterwarnings = ["ignore::DeprecationWarning:transformers.*"]

[tool.coverage.run]
source = ["steercert"]
omit = ["*/integrations/nnsight.py"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# hook closures are defined and consumed inside the same batch iteration
"src/steercert/hf.py" = ["B023"]
"tests/*" = ["B905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# nnsight patches .save() and .grad proxies onto tensors at runtime
module = "steercert.integrations.nnsight"
disable_error_code = ["attr-defined"]
